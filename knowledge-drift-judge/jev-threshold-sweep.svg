<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fcfcfb"/><text x="72.0" y="58.0" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#6b6880" text-anchor="start" letter-spacing="1">JEV 1.14 AS A FACT-CHECKING JUDGE - 172 CASES</text><text x="72.0" y="100.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="600" fill="#110828" text-anchor="start" letter-spacing="0">Raise the bar, and Jev decides fewer cases</text><text x="72.0" y="138.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="600" fill="#110828" text-anchor="start" letter-spacing="0">but gets more of them right</text><text x="72.0" y="180.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#3d3852" text-anchor="start" letter-spacing="0">Jev answers every case first and says how sure it is.</text><text x="72.0" y="206.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#3d3852" text-anchor="start" letter-spacing="0">If it is at least as sure as the bar, its answer stands. If not, an LLM judge decides.</text><line x1="72" y1="241" x2="100" y2="241" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><text x="110.0" y="246.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#3d3852" text-anchor="start" letter-spacing="0">Cases Jev decides alone</text><line x1="320" y1="241" x2="348" y2="241" stroke="#F35E5C" stroke-width="3" stroke-linecap="round"/><text x="358.0" y="246.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#3d3852" text-anchor="start" letter-spacing="0">Jev's own decisions that are right</text><rect x="628" y="234" width="28" height="14" rx="2" fill="#6b6880" fill-opacity="0.18"/><text x="666.0" y="246.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#3d3852" text-anchor="start" letter-spacing="0">95% interval</text><line x1="110" y1="560.0" x2="880" y2="560.0" stroke="#110828" stroke-width="1" stroke-opacity="0.6"/><text x="98.0" y="565.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="end" letter-spacing="0">0%</text><line x1="110" y1="490.0" x2="880" y2="490.0" stroke="#e3e6ea" stroke-width="1" stroke-opacity="1"/><text x="98.0" y="495.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="end" letter-spacing="0">25%</text><line x1="110" y1="420.0" x2="880" y2="420.0" stroke="#e3e6ea" stroke-width="1" stroke-opacity="1"/><text x="98.0" y="425.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="end" letter-spacing="0">50%</text><line x1="110" y1="350.0" x2="880" y2="350.0" stroke="#e3e6ea" stroke-width="1" stroke-opacity="1"/><text x="98.0" y="355.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="end" letter-spacing="0">75%</text><line x1="110" y1="280.0" x2="880" y2="280.0" stroke="#e3e6ea" stroke-width="1" stroke-opacity="1"/><text x="98.0" y="285.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="end" letter-spacing="0">100%</text><text x="110.0" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="middle" letter-spacing="0">0.5</text><text x="281.1" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="middle" letter-spacing="0">0.6</text><text x="452.2" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="middle" letter-spacing="0">0.7</text><text x="623.3" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="middle" letter-spacing="0">0.8</text><text x="794.4" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#6b6880" text-anchor="middle" letter-spacing="0">0.9</text><text x="495.0" y="618.0" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="400" fill="#3d3852" text-anchor="middle" letter-spacing="0">The bar: how sure Jev must be to decide alone</text><line x1="708.9" y1="280" x2="708.9" y2="560" stroke="#110828" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"/><text x="708.9" y="585.0" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#110828" text-anchor="middle" letter-spacing="0">0.85</text><polygon points="110.0,333.8 195.6,341.9 281.1,359.8 366.7,372.7 452.2,392.3 537.8,402.1 623.3,421.7 708.9,436.2 794.4,450.8 880.0,472.1 880.0,509.6 794.4,490.0 708.9,475.4 623.3,460.6 537.8,444.4 452.2,433.2 366.7,411.9 281.1,398.7 195.6,379.4 110.0,369.6" fill="#2a78d6" fill-opacity="0.13"/><polyline points="110.0,350.0 195.6,359.8 281.1,379.4 366.7,392.3 452.2,411.9 537.8,423.4 623.3,441.3 708.9,455.8 794.4,472.1 880.0,491.7" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="110.0,320.6 195.6,318.4 281.1,314.4 366.7,310.8 452.2,302.4 537.8,295.1 623.3,295.4 708.9,288.1 794.4,284.8 880.0,280.0 880.0,314.2 794.4,322.3 708.9,329.0 623.3,338.0 537.8,333.8 452.2,344.4 366.7,353.6 281.1,356.7 195.6,360.6 110.0,361.5" fill="#F35E5C" fill-opacity="0.13"/><polyline points="110.0,340.8 195.6,339.1 281.1,335.4 366.7,331.5 452.2,323.1 537.8,313.3 623.3,314.4 708.9,306.3 794.4,300.7 880.0,293.4" fill="none" stroke="#F35E5C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="708.9" cy="455.8" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2.5"/><text x="696.9" y="479.8" font-family="'Noto Sans', 'DejaVu S